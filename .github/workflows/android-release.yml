name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK packages
        run: android sdk install --canary platforms/android-37 build-tools/37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Validate version and signing secrets
        id: release_meta
        env:
          YUMERIN_RELEASE_KEYSTORE_BASE64: ${{ secrets.YUMERIN_RELEASE_KEYSTORE_BASE64 }}
          YUMERIN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.YUMERIN_RELEASE_KEYSTORE_PASSWORD }}
          YUMERIN_RELEASE_KEY_ALIAS: ${{ secrets.YUMERIN_RELEASE_KEY_ALIAS }}
          YUMERIN_RELEASE_KEY_PASSWORD: ${{ secrets.YUMERIN_RELEASE_KEY_PASSWORD }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' androidApp/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "::error::Tag version '$tag_version' must match app versionName '$app_version'."
            exit 1
          fi
          notes_file="docs/releases/v${app_version}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "::error::Release notes file '$notes_file' is missing."
            exit 1
          fi
          if [[ ! -f LICENSE ]]; then
            echo "::error::Add the project owner's chosen LICENSE before publishing a public release."
            exit 1
          fi
          for name in YUMERIN_RELEASE_KEYSTORE_BASE64 YUMERIN_RELEASE_KEYSTORE_PASSWORD YUMERIN_RELEASE_KEY_ALIAS YUMERIN_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret '$name' is not configured."
              exit 1
            fi
          done
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Restore existing release key
        env:
          YUMERIN_RELEASE_KEYSTORE_BASE64: ${{ secrets.YUMERIN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          key_file="$RUNNER_TEMP/yumerin-release.jks"
          printf '%s' "$YUMERIN_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "YUMERIN_RELEASE_STORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          YUMERIN_RELEASE_STORE_PASSWORD: ${{ secrets.YUMERIN_RELEASE_KEYSTORE_PASSWORD }}
          YUMERIN_RELEASE_KEY_ALIAS: ${{ secrets.YUMERIN_RELEASE_KEY_ALIAS }}
          YUMERIN_RELEASE_KEY_PASSWORD: ${{ secrets.YUMERIN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-watch-fs --no-configuration-cache -Pyumerin.phoneOptimizedApk=true :androidApp:assembleRelease

      - name: Verify APK signature
        id: verify_apk
        run: |
          apk="$(find androidApp/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          asset="$RUNNER_TEMP/Yumerin-${{ steps.release_meta.outputs.version }}-arm64.apk"
          cp "$apk" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.verify_apk.outputs.asset }}" --verify-tag --title "Yumerin ${{ steps.release_meta.outputs.version }}" --notes-file "${{ steps.release_meta.outputs.notes_file }}"
